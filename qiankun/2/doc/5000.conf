server {
    listen       5000; # 端口号以实际为准
    set $view_file /Users/chenyinjun/apps/qiankun;   # 根目录以实际为准

    # 静态资源
    location / {
        root    $view_file;
        try_files $uri $uri/ /index.html;
        index   index.html;
    }
   
    location ^~/child/app1 {
        root    $view_file;
        try_files $uri $uri/ /child/app1/index.html;
        index   index.html;
    }
    location ^~/child/app2 {
        root    $view_file;
        try_files $uri $uri/ /child/app2/index.html;
        index   index.html;
    }
    location ^~/child/app3 {
        root    $view_file;
        try_files $uri $uri/ /child/app3/index.html;
        index   index.html;
    }
    location ^~/child/app4 {
        root    $view_file;
        try_files $uri $uri/ /child/app4/index.html;
        index   index.html;
    }
    # 接口转发
    location ^~/baseApi/{
        proxy_pass http://10.64.15.153:9095/; 
        client_max_body_size    2000m;
    }
    

}
