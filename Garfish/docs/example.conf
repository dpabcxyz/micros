server {
    listen       8000; 
    set $view_file  /opt/dap_cloud/dist; 

    location / {
        root    $view_file;
        try_files $uri $uri/ /index.html;
        index   index.html;
    }
    location /child1/ {
        root    $view_file;
        try_files $uri /index.html;
        add_header Access-Control-Allow-Origin *; 
    }
    location /child1App/ {
        root    $view_file;
        try_files $uri $uri/ /child1App/index.html;
        index   index.html;
    }
    location /child2/ {
        root    $view_file;
        try_files $uri /index.html;
        add_header Access-Control-Allow-Origin *; 
    }
    location /child2App/ {
        root    $view_file;
        try_files $uri $uri/ /child2App/index.html;
        index   index.html;
    }
    location ^~/apiExample/{
        proxy_pass http://10.62.94.64:9100/; 
        client_max_body_size    2000m;
        proxy_send_timeout 1800s;
        send_timeout 1800s; 
    }
}
