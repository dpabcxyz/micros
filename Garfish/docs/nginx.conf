server {
    listen       8000; 
    set $view_file  E:/views/batch; 

    location / {
        root    $view_file;
        try_files $uri $uri/ /index.html;
        index   index.html;
    }

    # 主应用激活路径(对应 Garfish activeWhen /runtime):
    # 用户在主应用壳里访问/刷新子应用的 URL 前缀。try_files 不带 $uri/,
    # 该路径下除真实文件外一律回退主应用 index.html(壳), 由 Garfish 激活子应用,
    # 保证刷新 /governance/xxx 时保留主壳、不空白。
    location /governance/ {
        root    $view_file;
        try_files $uri /index.html;
        add_header Access-Control-Allow-Origin *; # 生产环境不需要此项
    }

    # 子应用部署路径(对应子应用 vite base /runtimeApp/):
    # 1) Garfish entry(/runtimeApp/index.html) 2) 静态资源(/runtimeApp/assets/*)
    # 3) 子应用独立访问入口。try_files 带 $uri/ 且 fallback 到子应用自身 index.html,
    # 支持独立访问 /runtimeApp/xxx 时按子应用 SPA 路由还原。
    # 与 /runtime/ 靠 nginx 最长前缀匹配区分, 互不干扰。
    location /governanceApp/ {
        root    $view_file;
        try_files $uri $uri/ /governanceApp/index.html;
        index   index.html;
    }

    location /operation/ {
        root    $view_file;
        try_files $uri /index.html;
        add_header Access-Control-Allow-Origin *; 
    }
    location /operationApp/ {
        root    $view_file;
        try_files $uri $uri/ /operationApp/index.html;
        index   index.html;
    }

    location /design/ {
        root    $view_file;
        try_files $uri /index.html;
        add_header Access-Control-Allow-Origin *; 
    }
    location /designApp/ {
        root    $view_file;
        try_files $uri /designApp/index.html;
        index   index.html;
    }
    location /GienComponents/ {
        root    $view_file;
        try_files $uri /GienComponents/index.html;
        index   index.html;
    }
    location ^~/apiExample/{
        proxy_pass http://10.62.94.64:9100/; 
        client_max_body_size    2000m;
        proxy_send_timeout 1800s;
        send_timeout 1800s; 
    }
    location ^~/socketExample/{
       proxy_pass http://10.62.94.64:9100/;
        client_max_body_size    2000m;
        proxy_send_timeout 1800s; 
        send_timeout 1800s; 
    }
}
