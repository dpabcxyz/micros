server {
    listen       9000;
    set $view_file  E:/views/mf;   # 根目录以实际为准

   

    # app1静态资源及代理
    location ^~/child/app1{
        root    $view_file;
        try_files $uri $uri/ /child/app1/index.html;
        index   index.html;
        add_header Access-Control-Allow-Origin *; # 生产环境不需要此项
    }

    # app2静态资源及代理
    location ^~/child/app2{
        root    $view_file;
        try_files $uri $uri/ /child/app2/index.html;
        index  index.html;
        add_header Access-Control-Allow-Origin *; # 生产环境不需要此项
    }

     # app3静态资源
    location ^~/child/app3{
        root    $view_file;
        try_files $uri $uri/ /child/app3/index.html;
        index   index.html;
        add_header Access-Control-Allow-Origin *; # 生产环境不需要此项
    }
}